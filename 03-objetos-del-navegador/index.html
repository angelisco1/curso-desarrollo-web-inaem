<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="newsletter.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/uuid@latest/dist/umd/uuidv4.min.js"></script>
</head>
<body>
    <div>
        <h1>Mailchimp 3000</h1>
    </div>

    <div>
        <form method="post">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" autofocus />
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" />
            </div>

            <div>
                <input type="checkbox" id="tyc" name="tyc" value="tyc" />
                <label for="tyc">Aceptas los términos y condiciones</label>
            </div>
            <div>
                <input type="checkbox" id="publi" name="publi" value="publi" />
                <label for="publi">Aceptas que te enviemos publicidad</label>
            </div>
            <div>
                <input type="checkbox" id="datos" name="datos" value="datos" />
                <label for="datos">Aceptas que compartamos tus datos con otras empresas</label>
            </div>

            <button type="submit">Suscribirme</button>
        </form>

    </div>

    <hr />

    <div>
        <table>
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Fecha susc.</th>
                    <th>TyC</th>
                    <th>Publi</th>
                    <th>Datos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
            <tfoot>
                <tr>
                    <td colspan="7">Total:</td>
                    <td id="totalSuscripciones" colspan="2">0</td>
                </tr>
            </tfoot>
        </table>
    </div>
    
    <!-- <script src="app.js"></script> -->
    <script src="newsletter.js"></script>
</body>
</html>

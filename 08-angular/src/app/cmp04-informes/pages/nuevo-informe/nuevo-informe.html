<h3>Nuevo informe</h3>

@if (formInforme) {
    <form [formGroup]="formInforme" (ngSubmit)="guardar()">
        <div>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" formControlName="titulo">
        </div>
        <div>
            <label for="contenido">Contenido</label>
            <textarea id="contenido" formControlName="contenido"></textarea>
        </div>
    
        <button type="submit" [disabled]="formInforme.invalid">Guardar</button>
    </form>
}
